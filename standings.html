<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Standings — IB Cricket League 2027</title>
<link rel="icon" href="favicon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page">
  <div class="brand-row">
    <div class="brand">
      <div class="brand-badge">🏏</div>
      <div class="brand-name">IB Cricket</div>
    </div>
    <div class="brand-links">
      <a href="index.html">Matches</a>
    </div>
  </div>

  <div class="card">
    <div class="card-header">STANDINGS</div>
    <div class="toolbar">
      <span id="asOfLabel" style="font-size:12px; color:var(--text-dim);"></span>
    </div>
    <div style="padding:16px 18px;">
      <table class="standings-table">
        <thead>
          <tr>
            <th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>Pts</th><th>NRR</th>
          </tr>
        </thead>
        <tbody id="standingsBody"></tbody>
      </table>
    </div>
    <div class="card-footer">
      <span>Points: win = 2, tie/no result = 1, loss = 0. Ranked by points, then Net Run Rate.</span>
      <a href="index.html">Matches ↗</a>
    </div>
  </div>
</div>

<script src="js/prng.js"></script>
<script src="js/data.js"></script>
<script src="js/schedule.js"></script>
<script src="js/simulate.js"></script>
<script src="js/season.js"></script>
<script src="js/standings.js"></script>
</body>
</html>
